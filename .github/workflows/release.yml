name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release as (e.g. v0.2.0-rc1). Leave empty for artifact-only dry run."
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wheels:
    name: build py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install maturin
        run: pip install maturin

      # ── Prod wheel (default [lib] name = "lean_multisig") ─────────────
      - name: Build prod wheel (macOS)
        if: runner.os == 'macOS'
        run: maturin build --release --out target/wheels -i python${{ matrix.python-version }}

      - name: Build prod wheel (Linux)
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        env:
          # Upstream's `no_packing` codepath (default x86-64 baseline) has a bug
          # in `as_constant` that panics with `unreachable!()`. Force the AVX2
          # packing path. x86-64-v3 = Haswell+ (2013), AMD Excavator+ (2015).
          RUSTFLAGS: "-C target-cpu=x86-64-v3"
        with:
          command: build
          args: --release --out target/wheels -i python${{ matrix.python-version }}
          manylinux: auto

      # ── Test wheel ([lib] name patched to "lean_multisig_test") ──────
      - name: Patch [lib] name for test build
        run: |
          cp Cargo.toml Cargo.toml.bak
          sed -i.tmp '/^\[lib\]/,/^\[/{s/^name = "lean_multisig"/name = "lean_multisig_test"/;}' Cargo.toml
          rm -f Cargo.toml.tmp

      - name: Build test wheel (macOS)
        if: runner.os == 'macOS'
        run: maturin build --release --features test-config --out target/wheels-test -i python${{ matrix.python-version }}

      - name: Build test wheel (Linux)
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v3"
        with:
          command: build
          args: --release --features test-config --out target/wheels-test -i python${{ matrix.python-version }}
          manylinux: auto

      - name: Restore Cargo.toml
        if: always()
        run: |
          if [ -f Cargo.toml.bak ]; then mv Cargo.toml.bak Cargo.toml; fi

      # ── Merge: drop the test .so into the prod wheel ─────────────────
      - name: Merge test .so into prod wheel
        run: |
          chmod +x scripts/merge_wheels.sh
          PROD_WHEEL=$(ls target/wheels/*.whl | head -1)
          TEST_WHEEL=$(ls target/wheels-test/*.whl | head -1)
          ./scripts/merge_wheels.sh "$PROD_WHEEL" "$TEST_WHEEL"
          echo "Final wheel contents:"
          unzip -l "$PROD_WHEEL"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: target/wheels/*.whl

  release:
    name: publish github release
    needs: build-wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: List collected wheels
        run: ls -lh dist/

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: dist/*.whl
          generate_release_notes: true
          prerelease: ${{ contains(steps.tag.outputs.tag, '-rc') }}
