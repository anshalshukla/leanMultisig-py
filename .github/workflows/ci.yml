name: CI

on:
  push:
    branches: [main, "devnet*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config: ["prod", "test"]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo check (prod)
        if: matrix.config == 'prod'
        run: cargo check

      - name: Cargo check (test-config)
        if: matrix.config == 'test'
        run: cargo check --features test-config

  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python-version: "3.14"
            config: prod
          - os: macos-14
            python-version: "3.14"
            config: test
          - os: ubuntu-latest
            python-version: "3.14"
            config: prod
          - os: ubuntu-latest
            python-version: "3.14"
            config: test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Setup virtualenv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV

      - name: Install deps
        run: pip install maturin pytest

      - name: Build and install (prod)
        if: matrix.config == 'prod'
        run: maturin develop --release

      - name: Build and install (test-config)
        if: matrix.config == 'test'
        run: |
          maturin develop --release --features test-config
          # Rename the .so: pymodule is lean_multisig_test but maturin outputs lean_multisig
          SITE=$(python -c "import sysconfig; print(sysconfig.get_path('platlib'))")
          echo "Looking for .so in: $SITE/lean_multisig_py/"
          ls -la "$SITE/lean_multisig_py/" || true
          for f in "$SITE"/lean_multisig_py/lean_multisig.cpython-*; do
            if [ -f "$f" ]; then
              dest="${f/lean_multisig.cpython/lean_multisig_test.cpython}"
              echo "Renaming: $f -> $dest"
              mv "$f" "$dest"
            fi
          done

      - name: Run tests
        run: pytest tests/ -v
