[build-system]
requires = ["setuptools>=68", "wheel", "maturin>=1.5.1"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-multisig-py"
version = "0.1.0"
description = "Python bindings for lean-multisig XMSS aggregation"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
