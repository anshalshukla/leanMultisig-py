[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "lean-multisig-py"
version = "0.1.0"
description = "Python bindings for lean-multisig XMSS aggregation"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
python-source = "."
module-name = "lean_multisig_py.lean_multisig"
include = [
    { path = "lean_multisig_py/lean_multisig_test*.so", format = "wheel" },
    { path = "lean_multisig_py/lean_multisig_test*.pyd", format = "wheel" },
]
