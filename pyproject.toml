[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "lean-multisig-py"
version = "0.0.5"
description = "Python bindings for lean-multisig XMSS aggregation (devnet5)"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
python-source = "."
module-name = "lean_multisig_py.lean_multisig"
# In release wheels (built by the release.yml GH Actions workflow), the prod build is
# extended with the test-config .so so a single wheel ships both variants.
include = [
    { path = "lean_multisig_py/lean_multisig_test*.so", format = "wheel" },
    { path = "lean_multisig_py/lean_multisig_test*.pyd", format = "wheel" },
]
