[package]
name = "lean-multisig-py"
version = "0.1.0"
edition = "2021"

[lib]
name = "lean_multisig"
crate-type = ["cdylib"]

[features]
test-config = ["rec_aggregation/test-config", "leansig_wrapper/test-config"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module"] }
rec_aggregation = { git = "https://github.com/leanEthereum/leanMultisig", branch = "devnet5" }
backend = { git = "https://github.com/leanEthereum/leanMultisig", branch = "devnet5" }
leansig_wrapper = { git = "https://github.com/leanEthereum/leanMultisig", branch = "devnet5" }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
ssz = { package = "ethereum_ssz", version = "0.10.0" }
