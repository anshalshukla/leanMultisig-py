[package]
name = "lean-multisig-py"
version = "0.1.0"
edition = "2021"

[lib]
name = "lean_multisig"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module"] }
lean-multisig = { git = "https://github.com/leanEthereum/leanMultisig.git", rev = "e4474138487eeb1ed7c2e1013674fe80ac9f3165" }
bincode = "1.3.3"
serde = { version = "1.0.228", features = ["derive"] }
